name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # One goreleaser run on macOS: darwin needs cgo (system clang), and linux /
  # windows are pure Go, so they cross-compile from the same runner. Produces
  # aos_<version>_<os>_<arch>.tar.gz (zip on windows) + checksums.txt, which is
  # what install.sh / install.cmd download.
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v5
        with: { go-version: stable }
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # npm: @muthuishere/aos is a thin shim whose install fetches the release
  # assets above, so it must publish after them. Skips cleanly without NPM_TOKEN.
  npm:
    needs: release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      id-token: write   # npm provenance
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - name: Check for NPM_TOKEN
        id: token
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::notice::NPM_TOKEN secret not set -- skipping npm publish"
            echo "have=false" >> "$GITHUB_OUTPUT"
          else
            echo "have=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.token.outputs.have == 'true'
      - uses: actions/setup-node@v4
        if: steps.token.outputs.have == 'true'
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Publish @muthuishere/aos
        if: steps.token.outputs.have == 'true'
        working-directory: npm
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          TAG=latest
          case "$VERSION" in *-*) TAG=next ;; esac
          npm publish --access public --provenance --tag "$TAG"
