name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # One goreleaser run on macOS: darwin needs cgo (system clang), and linux /
  # windows are pure Go, so they cross-compile from the same runner. Produces
  # aos_<version>_<os>_<arch>.tar.gz (zip on windows) + checksums.txt, which is
  # what install.sh / install.cmd download.
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v5
        with: { go-version: stable }
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # npm: @muthuishere/aos is a thin shim whose install fetches the release
  # assets above, so it must publish after them. Auth is npm trusted publishing
  # (OIDC): no token secret; npm attaches provenance automatically.
  npm:
    needs: release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Publish @muthuishere/aos
        working-directory: npm
        run: |
          npm install -g npm@latest   # trusted publishing needs npm >= 11.5.1
          VERSION="${GITHUB_REF_NAME#v}"
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          TAG=latest
          case "$VERSION" in *-*) TAG=next ;; esac
          npm publish --access public --tag "$TAG"
