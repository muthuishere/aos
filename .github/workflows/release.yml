name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # One goreleaser run on macOS: darwin needs cgo (system clang), and linux /
  # windows are pure Go, so they cross-compile from the same runner. Produces
  # aos_<version>_<os>_<arch>.tar.gz (zip on windows) + checksums.txt, which is
  # what install.sh / install.cmd download.
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v5
        with: { go-version: stable }
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
