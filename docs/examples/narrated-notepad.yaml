# Narrated Notepad demo (Windows). Uses a Notepad window this script opens.
# Run from a folder holding aos-batch-demo.txt: aos batch narrated-notepad.yaml
steps:
  - launch: notepad aos-batch-demo.txt --wait=8000
  - record: demo.mp4 window --title=aos-batch-demo --audio=none
  - wait: 1.5s
  - say: This demo is one aos batch file, on Windows.
  - parallel:
      - say: I type into Notepad while I talk.
      - do: key type "Hello from aos batch. " --title=aos-batch-demo
  - parallel:
      - say: The voice is the built in Windows voice.
      - do: key type "No mic. " --title=aos-batch-demo
  - parallel:
      - say: And it lands in the video, in sync.
      - do: key type "Done." --title=aos-batch-demo
  - wait: 1.5s
  - record-stop
  - do: key press ctrl+s --title=aos-batch-demo
  - do: key press ctrl+w --title=aos-batch-demo
