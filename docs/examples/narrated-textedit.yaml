# Narrated TextEdit demo (macOS). Run: aos batch docs/examples/narrated-textedit.yaml
steps:
  - record: /tmp/tts/bdemo.mp4 window --app=TextEdit --audio=none
  - wait: 1.5s
  - say: This demo is one aos batch file.
  - parallel:
      - say: I type into TextEdit while I talk.
      - type: TextEdit "Hello from aos batch. "
  - parallel:
      - say: Speech and typing run together, in parallel.
      - type: TextEdit "Parallel steps. "
  - parallel:
      - say: And the voice lands in the video, in sync.
      - type: TextEdit "Done."
  - wait: 1.5s
  - record-stop
